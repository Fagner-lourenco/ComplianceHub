<!--
===============================================================================
COMPLIANCEHUB · PESQUISA DE PRODUTO / UX PARA RECRUTADORAS DE RH
Versão: CH-RH-UX-2026.09-V3 · CANDIDATA A PUBLICAÇÃO
===============================================================================

OBJETIVO
- Coletar feedback qualitativo e quantitativo das recrutadoras que usam o
  ComplianceHub de forma recorrente.
- Orientar a refatoração da experiência do Portal do Cliente sem transformar a
  pesquisa em uma validação enviesada de funcionalidades já imaginadas.
- Descobrir tarefas feitas fora do ComplianceHub que podem indicar integrações,
  automações ou novas capacidades de produto.

PRINCÍPIOS DE PESQUISA
1. Primeiro perguntamos sobre o trabalho real; só depois mostramos possibilidades.
2. Perguntas de oportunidade abertas vêm antes da lista de recursos sugeridos.
3. A pesquisa não pergunta nome da participante por padrão.
4. Dados de candidatos NÃO devem ser inseridos na pesquisa.
5. O resultado do ComplianceHub é tratado como apoio à decisão; a decisão de
   contratação permanece humana e sob responsabilidade da organização.
6. A árvore é condicional: cada pessoa vê apenas perguntas relevantes.

DIREÇÃO VISUAL
- Base branca / quase branca.
- Petróleo profundo para confiança e governança.
- Verde mineral para ações primárias.
- Azul aço para informação.
- Bronze para atenção/revisão.
- Sem roxo, glow, glassmorphism ou estética genérica de “IA”.

PUBLICAÇÃO / BACKEND
- O arquivo funciona sozinho no navegador e salva progresso em localStorage.
- Por segurança, nenhum endpoint de produção é inventado neste protótipo.
- Para publicação real, defina CONFIG.submitEndpoint abaixo.
- O endpoint deve aceitar POST application/json e responder 2xx.
- Enquanto submitEndpoint estiver vazio, a página usa MODO DE PRÉVIA: a resposta
  pode ser baixada em JSON no final, mas não é enviada a um servidor.
- BLOQUEIO DE PUBLICAÇÃO: configure e teste submitEndpoint antes de enviar o link
  às recrutadoras. Publicar com o campo vazio não coletará respostas centralmente.

ACESSIBILIDADE
- Navegação por teclado.
- Foco visível.
- Labels e fieldsets semânticos.
- Estados não dependem apenas de cor.
- prefers-reduced-motion respeitado.
===============================================================================
-->

<script>
/* =============================================================================
   1. CONFIGURAÇÃO DE PUBLICAÇÃO
   ============================================================================= */
const CONFIG = {
  surveyVersion: "CH-RH-UX-2026.09-V3",
  storageKey: "compliancehub_rh_research_v3",
  estimatedMinutes: "~8 min",

  // PRODUÇÃO:
  // Exemplo: "/api/product-feedback/rh-research"
  // Deixe vazio durante validação visual / homologação.
  submitEndpoint: "https://southamerica-east1-compliance-hub-br.cloudfunctions.net/submitResearchResponse",

  // Em produção, prefira true para cookies de sessão same-origin.
  credentials: "omit",

  // Limite usado na pergunta "escolha até 3".

/* =============================================================================
   2. DADOS E ÁRVORE DA PESQUISA

   Estratégia:
   - Perguntas rápidas dão contexto operacional.
   - Perguntas abertas aparecem ANTES das sugestões de funcionalidades.
   - Branches evitam perguntas irrelevantes.
   - Não perguntamos "frequência de uso": o público desta rodada já é composto
     por usuárias intensivas; volume diário diferencia melhor a experiência.
   ============================================================================= */
const QUESTIONS = [
  {
    id:"daily_volume", section:"Seu dia a dia", kicker:"Contexto de uso",
    title:"Em um dia típico, quantas análises você costuma solicitar?",
    help:"Não precisa ser exato. Queremos entender o volume com que você lida.",
    type:"single", required:true,
    options:[
      ["1_3","1 a 3"],["4_7","4 a 7"],["8_15","8 a 15"],["16_plus","16 ou mais"],["varies","Varia muito conforme o dia"]

  },
  {
    id:"arrival_mode", section:"Seu dia a dia", kicker:"Contexto de uso",
    title:"Os candidatos chegam para você, normalmente, de que forma?",
    help:"Isso ajuda a entender se o fluxo é individual ou se existe uma necessidade de trabalhar com volume.",
    type:"single", required:true,
    options:[
      ["one_by_one","Um de cada vez"],
      ["batches","Vários candidatos de uma vez"],
      ["both","Das duas formas"],
      ["other","Outro fluxo"]
    ]
  },
  {
    id:"candidate_source", section:"Seu dia a dia", kicker:"Origem dos dados",
    title:"De onde você normalmente pega o CPF e os dados do candidato antes de abrir o ComplianceHub?",
    help:"Marque tudo o que fizer parte do seu fluxo. Essa pergunta pode revelar oportunidades de integração.",
    type:"multi", required:true,
    options:[
      ["ats","Sistema de recrutamento / ATS"],
      ["spreadsheet","Planilha"],
      ["internal_system","Sistema interno da empresa"],
      ["email","E-mail"],
      ["whatsapp","WhatsApp / mensagem"],
      ["resume","Currículo / ficha do candidato"],
      ["other","Outro"]
    ]
  },
  {
    id:"devices", section:"Seu dia a dia", kicker:"Dispositivo",
    title:"Em quais dispositivos você realmente usa o ComplianceHub?",
    help:"Marque o uso real, mesmo que um deles seja apenas ocasional.",
    type:"multi", required:true,
    options:[["desktop","Computador / notebook"],["mobile","Celular"],["tablet","Tablet"]]

  {

/* =============================================================================
   3. ESTADO LOCAL E UTILITÁRIOS
   ============================================================================= */
let state = loadState();
let currentIndex = Number.isInteger(state.currentIndex) ? state.currentIndex : 0;
let screen = state.screen || "intro"; // intro | survey | review | thankyou
let lastSavedAt = null;

function freshState(){
  return {
    respondentId: crypto.randomUUID ? crypto.randomUUID() : "anon-"+Date.now()+"-"+Math.random().toString(36).slice(2),
    surveyVersion: CONFIG.surveyVersion,
    startedAt: null,
    answers:{}, currentIndex:0, screen:"intro"
  };
}
function loadState(){
  try{
    const raw=localStorage.getItem(CONFIG.storageKey);
    if(!raw) return freshState();
    const parsed=JSON.parse(raw);
    if(parsed.surveyVersion!==CONFIG.surveyVersion) return freshState();
    return {...freshState(),...parsed,answers:parsed.answers||{}};
  }catch{return freshState();}
}
function saveState(){
  state.currentIndex=currentIndex; state.screen=screen;
  try{ localStorage.setItem(CONFIG.storageKey,JSON.stringify(state)); }catch{}
  lastSavedAt=new Date();
  updateSaveState();
}
function clearState(){ try{ localStorage.removeItem(CONFIG.storageKey); }catch{} }
function answers(){return state.answers;}
function visibleQuestions(){return QUESTIONS.filter(q=>!q.showIf||q.showIf(answers()));}
function currentQuestion(){const list=visibleQuestions(); currentIndex=Math.max(0,Math.min(currentIndex,list.length-1)); return list[currentIndex];}
function otherKey(q){return `${q.id}__other`;}
function hasOtherSelected(q,value=answers()[q.id]){return value==="other"||(Array.isArray(value)&&value.includes("other"));}
function otherFieldMarkup(q,value){
  if(!(q.options||[]).some(o=>o[0]==="other"))return "";
  const detail=escapeHtml(answers()[otherKey(q)]||"");
  return `<div class="other-detail" id="${q.id}-other-wrap" ${hasOtherSelected(q,value)?"":"hidden"}><label for="${q.id}-other">Outro — conte qual</label><input id="${q.id}-other" maxlength="300" value="${detail}" placeholder="Descreva em poucas palavras"></div>`;
}
function pruneHiddenAnswers(){
  let changed=true;
  while(changed){
    changed=false;
    for(const q of QUESTIONS){
      if(q.showIf&&!q.showIf(answers())&&answers()[q.id]!==undefined){delete state.answers[q.id];delete state.answers[otherKey(q)];changed=true;}
    }
  }
}
function escapeHtml(value="") {return String(value).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
function optionLabel(q,value){
  if(Array.isArray(value)) return value.map(v=>optionLabel(q,v)).join(", ");
  const found=(q.options||[]).find(o=>o[0]===value); return found?found[1]:String(value??"");
}
function humanAnswer(q,value){
  if(value===undefined||value===null||value===""||(Array.isArray(value)&&!value.length)) return "Não respondida / opcional";
  if(q.type==="scale5") return `${value}/5`;
  if(q.type==="scale10") return `${value}/10`;
  if(q.type==="single"||q.type==="multi"){
    const base=optionLabel(q,value); const detail=hasOtherSelected(q,value)?String(answers()[otherKey(q)]||"").trim():"";
    return detail?`${base} — ${detail}`:base;
  }
  return String(value);
}
function viewportCategory(){const w=window.innerWidth;return w<600?"mobile":w<980?"tablet":"desktop";}

const card=document.getElementById("surveyCard");
const topProgress=document.getElementById("topProgress");
const headerProgressText=document.getElementById("headerProgressText");

function render(){
  if(screen==="intro") return renderIntro();
  if(screen==="review") return renderReview();
  if(screen==="thankyou") return renderThankyou();
  return renderQuestion();
}
function renderIntro(){
  topProgress.style.width="0%";
  headerProgressText.textContent=`Pesquisa de produto · ${CONFIG.estimatedMinutes}`;
  card.className="card";
  card.innerHTML=`
    <aside class="side">
      <div><span class="section-label">Pesquisa de experiência</span><h2>O próximo ComplianceHub começa pelo trabalho real.</h2><p>Antes de decidir novas telas e recursos, queremos entender como a ferramenta participa da sua rotina.</p></div>
      <div class="side-foot">Rodada com usuárias atuais · RH / Recrutamento e Seleção</div>
    </aside>
    <div class="content"><div class="intro fade-in">
      <div class="eyebrow">Você usa. Você sabe onde dói.</div>
      <h1>Ajude a construir o <em>próximo ComplianceHub.</em></h1>
      <p class="lead">Estamos revisando profundamente a experiência da plataforma. Queremos preservar o que funciona, remover atritos e descobrir o que poderia tornar sua rotina mais simples — inclusive coisas que hoje você precisa fazer fora do ComplianceHub.</p>
      <div class="intro-grid">
        <div><small>Tempo estimado</small><strong>cerca de 8 minutos</strong></div>
        <div><small>Formato</small><strong>perguntas rápidas + alguns campos abertos</strong></div>
        <div><small>Objetivo</small><strong>decisões reais de produto e UX</strong></div>
      </div>
      <div class="privacy-box"><strong>Queremos respostas sinceras.</strong> A pesquisa não avalia seu desempenho e não pede seu nome. Não inclua nomes, CPFs, números de processo ou qualquer dado de candidatos nos campos abertos.</div>
      <div class="start-row"><button class="btn btn-primary" id="startBtn">Começar pesquisa →</button><span>Seu progresso fica salvo neste dispositivo.</span></div>
    </div></div>`;
  document.getElementById("startBtn").onclick=()=>{if(!state.startedAt)state.startedAt=new Date().toISOString();screen="survey";currentIndex=0;saveState();render();};
}
function sideMarkup(q,index,total){
  const pct=Math.round(((index+1)/total)*100);
  return `<aside class="side">
    <div><span class="section-label">${escapeHtml(q.section)}</span><h2>${escapeHtml(q.kicker)}</h2><p>Uma pergunta por vez para reduzir esforço e manter a resposta focada.</p></div>
    <div class="side-index"><strong>${String(index+1).padStart(2,"0")}</strong><span>de ${String(total).padStart(2,"0")} perguntas desta rota · ${pct}%</span></div>
    <div class="side-foot">Resposta salva automaticamente</div>
  </aside>`;
}
function renderQuestion(){
  const list=visibleQuestions();
  const q=currentQuestion();
  const idx=list.findIndex(item=>item.id===q.id);
  currentIndex=idx;
  const pct=((idx)/Math.max(list.length,1))*100;
  topProgress.style.width=`${pct}%`;
  headerProgressText.textContent=`${q.section} · ${idx+1}/${list.length}`;
  card.innerHTML=`${sideMarkup(q,idx,list.length)}<div class="content"><div class="question-wrap fade-in">
    <div class="question-kicker">${escapeHtml(q.kicker)}</div>
    <h1 class="question-title" id="questionTitle">${escapeHtml(q.title)}</h1>
    ${q.help?`<p class="question-help">${escapeHtml(q.help)}</p>`:""}
    ${renderControl(q)}
    ${q.warning?`<div class="micro-warning"><span>↳</span><div><b>Importante:</b> ${escapeHtml(q.warning)}</div></div>`:""}
    <div class="error" id="validationError" role="alert"></div>
  </div>${navMarkup(idx,list.length)}</div>`;
  bindQuestionEvents(q);
  updateSaveState();
  window.scrollTo({top:0,behavior:"smooth"});
  setTimeout(()=>{const focusable=card.querySelector("textarea,input:not([type=radio]):not([type=checkbox]),button"); if(focusable&&window.innerWidth>840){}},20);
}
function renderControl(q){
  const value=answers()[q.id];
  if(q.type==="single"){
    return `<div class="options" role="radiogroup" aria-labelledby="questionTitle">${q.options.map((o,i)=>`
      <div class="option radio"><input type="radio" id="${q.id}-${i}" name="${q.id}" value="${escapeHtml(o[0])}" ${value===o[0]?"checked":""}><label for="${q.id}-${i}"><span class="choice-mark"></span><span class="option-copy"><strong>${escapeHtml(o[1])}</strong>${o[2]?`<small>${escapeHtml(o[2])}</small>`:""}</span></label></div>`).join("")}</div>${otherFieldMarkup(q,value)}`;
  }
  if(q.type==="multi"){
    const selected=Array.isArray(value)?value:[];
    return `${q.maxChoices?`<div class="max-note">Escolha até ${q.maxChoices}</div>`:""}<div class="options">${q.options.map((o,i)=>`
      <div class="option checkbox"><input type="checkbox" id="${q.id}-${i}" name="${q.id}" value="${escapeHtml(o[0])}" ${selected.includes(o[0])?"checked":""}><label for="${q.id}-${i}"><span class="choice-mark"></span><span class="option-copy"><strong>${escapeHtml(o[1])}</strong>${o[2]?`<small>${escapeHtml(o[2])}</small>`:""}</span></label></div>`).join("")}</div>${otherFieldMarkup(q,selected)}`;
  }
  if(q.type==="scale5"||q.type==="scale10"){
    const max=q.type==="scale5"?5:10; const start=q.type==="scale5"?1:0;
    return `<div class="scale ${q.type==="scale10"?"ten":""}" role="radiogroup" aria-labelledby="questionTitle">${Array.from({length:max-start+1},(_,i)=>i+start).map(n=>`<label><input type="radio" name="${q.id}" value="${n}" ${String(value)===String(n)?"checked":""}><span class="scale-box">${n}</span></label>`).join("")}</div><div class="scale-labels"><span>${escapeHtml(q.labels?.[0]||"")}</span><span>${escapeHtml(q.labels?.[1]||"")}</span></div>`;
  }
  if(q.type==="text"){
    const safe=escapeHtml(value||""); return `<textarea class="textarea" id="${q.id}" maxlength="${q.maxLength||1000}" placeholder="Escreva com suas palavras…">${safe}</textarea><div class="counter" id="${q.id}-counter">${String(value||"").length}/${q.maxLength||1000}</div>`;
  }
  if(q.type==="input") return `<input class="text-input" id="${q.id}" maxlength="${q.maxLength||200}" value="${escapeHtml(value||"")}" placeholder="E-mail corporativo ou WhatsApp">`;
  return "";
}
function navMarkup(idx,total){
  return `<div class="navbar">
    <div class="nav-left">${idx>0?`<button class="btn btn-secondary" id="backBtn">← Voltar</button>`:`<button class="btn btn-ghost" id="backIntroBtn">← Início</button>`}<span class="save-state" id="saveState">salvo</span></div>
    <div class="nav-right"><span class="kbd">Enter</span><button class="btn btn-primary" id="nextBtn">${idx===total-1?"Revisar respostas →":"Continuar →"}</button></div>
  </div>`;
}
function bindQuestionEvents(q){
  const controls=[...card.querySelectorAll(`input[name="${q.id}"]`)];
  controls.forEach(el=>el.addEventListener("change",()=>{
    if(q.type==="multi"){
      let selected=[...card.querySelectorAll(`input[name="${q.id}"]:checked`)].map(x=>x.value);
      // Opções semanticamente exclusivas ("nenhuma", "não preciso", "nada") não podem coexistir com outras.
      const exclusiveValues=new Set(["none","no_need","nothing"]);
      if(exclusiveValues.has(el.value)&&el.checked){selected=[el.value];controls.forEach(x=>{if(x.value!==el.value)x.checked=false;});}
      else if(!exclusiveValues.has(el.value)&&el.checked){selected=selected.filter(v=>!exclusiveValues.has(v));controls.forEach(x=>{if(exclusiveValues.has(x.value))x.checked=false;});}
      if(q.maxChoices&&selected.length>q.maxChoices){el.checked=false;showError(`Escolha no máximo ${q.maxChoices} opções.`);return;}
      state.answers[q.id]=selected;
    }else state.answers[q.id]=el.value;
    if(!hasOtherSelected(q))delete state.answers[otherKey(q)];
    const otherWrap=document.getElementById(`${q.id}-other-wrap`);if(otherWrap)otherWrap.hidden=!hasOtherSelected(q);
    pruneHiddenAnswers();saveState();hideError();
  }));
  const otherInput=card.querySelector(`#${CSS.escape(q.id)}-other`);
  if(otherInput)otherInput.addEventListener("input",()=>{state.answers[otherKey(q)]=otherInput.value;saveState();hideError();});
  const text=card.querySelector(`#${CSS.escape(q.id)}`);
  if(text&&(q.type==="text"||q.type==="input")) text.addEventListener("input",()=>{
    state.answers[q.id]=text.value; pruneHiddenAnswers(); saveState();
    const c=document.getElementById(`${q.id}-counter`);if(c)c.textContent=`${text.value.length}/${q.maxLength||1000}`;
    hideError();
  });
  document.getElementById("nextBtn").onclick=()=>nextQuestion();
  const back=document.getElementById("backBtn"); if(back)back.onclick=()=>{currentIndex=Math.max(0,currentIndex-1);saveState();render();};
  const backIntro=document.getElementById("backIntroBtn"); if(backIntro)backIntro.onclick=()=>{screen="intro";saveState();render();};
}
function showError(msg){const el=document.getElementById("validationError");if(el){el.textContent=msg;el.classList.add("show");}}
function hideError(){document.getElementById("validationError")?.classList.remove("show");}
function validateCurrent(){
  const q=currentQuestion();const value=answers()[q.id];
  if(q.required){
    const empty=value===undefined||value===null||value===""||(Array.isArray(value)&&value.length===0)||(typeof value==="string"&&value.trim()==="");
    if(empty){showError("Responda esta pergunta para continuar.");return false;}
  }
  if(q.maxChoices&&Array.isArray(value)&&value.length>q.maxChoices){showError(`Escolha no máximo ${q.maxChoices} opções.`);return false;}
  if(hasOtherSelected(q)&&!String(answers()[otherKey(q)]||"").trim()){showError("Conte rapidamente o que significa ‘Outro’ para você.");return false;}
  return true;
}
function nextQuestion(){
  if(!validateCurrent())return;
  const list=visibleQuestions();
  if(currentIndex>=list.length-1){screen="review";saveState();render();return;}
  currentIndex++;saveState();render();
}
function updateSaveState(){const el=document.getElementById("saveState");if(el)el.textContent=lastSavedAt?"salvo agora":"salvo";}

/* =============================================================================
   5. REVISÃO E SUBMISSÃO
   ============================================================================= */
function renderReview(){
  topProgress.style.width="96%";headerProgressText.textContent="Revisão final";
  const answered=QUESTIONS.filter(q=>answers()[q.id]!==undefined && (!q.showIf||q.showIf(answers())));
  card.innerHTML=`<aside class="side"><div><span class="section-label">Antes de enviar</span><h2>Revise sem burocracia.</h2><p>Se quiser conferir alguma resposta, abra o resumo abaixo antes do envio.</p></div><div class="side-index"><strong>✓</strong><span>${answered.length} respostas registradas</span></div><div class="side-foot">Nenhum dado de candidato deve constar nas respostas</div></aside>
  <div class="content"><div class="review fade-in"><h1>Pronto para enviar.</h1><p>Suas respostas estão salvas. Você pode enviar agora ou abrir o resumo para revisar e editar algum item.</p>
  <div id="submitStatus"></div><div class="review-actions review-actions-top"><button class="btn btn-secondary" id="reviewBack">← Voltar</button><button class="btn btn-primary" id="submitBtn">Enviar pesquisa →</button></div>
  <details class="review-details"><summary>Revisar todas as respostas (${answered.length})</summary><div class="review-list">${answered.map((q,i)=>`<div class="review-item"><div class="review-num">${String(i+1).padStart(2,"0")}</div><div class="review-copy"><strong>${escapeHtml(q.title)}</strong><span>${escapeHtml(humanAnswer(q,answers()[q.id]))}</span></div><button class="review-edit" data-edit="${q.id}">Editar</button></div>`).join("")}</div></details>
  </div></div>`;
  card.querySelectorAll("[data-edit]").forEach(btn=>btn.onclick=()=>{screen="survey";const list=visibleQuestions();currentIndex=Math.max(0,list.findIndex(q=>q.id===btn.dataset.edit));saveState();render();});
  document.getElementById("reviewBack").onclick=()=>{screen="survey";currentIndex=Math.max(0,visibleQuestions().length-1);saveState();render();};
  document.getElementById("submitBtn").onclick=()=>submitSurvey();
}
function buildPayload(){
  pruneHiddenAnswers();
  const cleanAnswers={};
  for(const q of visibleQuestions()){
    if(answers()[q.id]!==undefined)cleanAnswers[q.id]=answers()[q.id];
    if(hasOtherSelected(q)&&String(answers()[otherKey(q)]||"").trim())cleanAnswers[otherKey(q)]=String(answers()[otherKey(q)]).trim();
  }
  const startMs=state.startedAt?new Date(state.startedAt).getTime():Date.now();
  return {
    surveyVersion:CONFIG.surveyVersion,
    origem:(new URLSearchParams(location.search).get("origem")||"").slice(0,120)||null,
    respondentId:state.respondentId,
    startedAt:state.startedAt,
    submittedAt:new Date().toISOString(),
    durationSeconds:Math.max(0,Math.round((Date.now()-startMs)/1000)),
    viewportCategory:viewportCategory(),
    locale:navigator.language||"pt-BR",
    answers:cleanAnswers
  };
}
async function submitSurvey(){
  const btn=document.getElementById("submitBtn");const status=document.getElementById("submitStatus");
  btn.disabled=true;btn.textContent="Enviando…";
  const payload=buildPayload();
  if(!CONFIG.submitEndpoint){
    state.submission={mode:"preview",payload,at:new Date().toISOString()};
    screen="thankyou";saveState();render();return;
  }
  try{
    const response=await fetch(CONFIG.submitEndpoint,{method:"POST",credentials:CONFIG.credentials,headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)});
    if(!response.ok)throw new Error(`Falha no envio (${response.status})`);
    state.submission={mode:"server",at:new Date().toISOString()};screen="thankyou";clearState();render();
  }catch(err){
    status.className="submit-status fail";status.textContent="Não conseguimos enviar agora. Suas respostas continuam salvas neste dispositivo. Tente novamente.";
    btn.disabled=false;btn.textContent="Tentar enviar novamente →";
  }
}

/* =============================================================================
   6. TELA FINAL / EXPORTAÇÃO LOCAL DO MODO DE PRÉVIA
   ============================================================================= */
function renderThankyou(){
  topProgress.style.width="100%";headerProgressText.textContent="Concluído";
  const preview=!CONFIG.submitEndpoint||state.submission?.mode==="preview";
  card.innerHTML=`<aside class="side"><div><span class="section-label">Obrigado</span><h2>Feedback vira decisão de produto.</h2><p>As respostas serão agrupadas para identificar padrões, atritos e oportunidades.</p></div><div class="side-index"><strong>100%</strong><span>pesquisa concluída</span></div><div class="side-foot">ComplianceHub · evolução orientada por uso real</div></aside>
  <div class="content"><div class="thankyou fade-in"><div class="thankyou-mark">✓</div><h1>Obrigada por ajudar a construir o próximo ComplianceHub.</h1><p>Seu feedback será usado para priorizar melhorias de fluxo, clareza, acompanhamento e novas oportunidades — inclusive aquelas que hoje acontecem fora da plataforma.</p>
  ${preview?`<span class="preview-badge">Modo de prévia · nenhuma resposta foi enviada a servidor</span>`:""}
  <div class="thankyou-panel"><div><strong>O que acontece agora</strong><span>As respostas da rodada serão comparadas por volume de uso, atritos, confiança no resultado, trabalho residual e oportunidades.</span></div><div><strong>Entrevistas opcionais</strong><span>Quem se disponibilizou poderá ser convidada para uma conversa curta de aprofundamento.</span></div></div>
  <div class="review-actions">${preview?`<button class="btn btn-secondary" id="downloadJson">Baixar resposta de teste (JSON)</button>`:""}<button class="btn btn-primary" id="finishBtn">Finalizar</button></div></div></div>`;
  if(preview)document.getElementById("downloadJson").onclick=()=>downloadJson(buildPayload());
  document.getElementById("finishBtn").onclick=()=>{clearState();state=freshState();screen="intro";currentIndex=0;render();};
}
function downloadJson(payload){
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`compliancehub-feedback-${state.respondentId.slice(0,8)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* =============================================================================
   7. ATALHOS E SEGURANÇA DE NAVEGAÇÃO
   ============================================================================= */
document.addEventListener("keydown",event=>{
  if(screen!=="survey")return;
  const active=document.activeElement;
  const isTextarea=active?.tagName==="TEXTAREA";
  if(event.key==="Enter"&&!event.shiftKey&&!isTextarea){
    const btn=document.getElementById("nextBtn");if(btn){event.preventDefault();btn.click();}
  }
  if((event.ctrlKey||event.metaKey)&&event.key==="Enter"&&isTextarea){event.preventDefault();document.getElementById("nextBtn")?.click();}
});
window.addEventListener("beforeunload",()=>saveState());

/* Inicia a experiência. */
render();
</script>
